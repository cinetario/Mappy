<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relevo3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 L11 10 L17 19 L21 13 L30 26 Z' fill='%232f6f4f'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <aside id="painel">
        <div id="painel-rolagem">
          <header>
            <h1>Relevo3D</h1>
            <p class="sub">Mapas 3D para impressão</p>
          </header>

          <div id="presets" role="group" aria-label="Presets">
            <button type="button" data-preset="soTerreno">Só terreno</button>
            <button type="button" data-preset="topografico">Topográfico</button>
            <button type="button" data-preset="impressao3d">Impressão 3D</button>
            <button type="button" id="btn-redefinir" class="secundario" title="Volta todos os parâmetros ao padrão (mantém a área)">Redefinir</button>
          </div>

          <section>
            <h2>Local</h2>
            <form id="form-busca" class="linha">
              <input id="busca" type="search" placeholder="Endereço, cidade, montanha…" autocomplete="off" />
              <button type="submit">Buscar</button>
            </form>
            <ul id="resultados"></ul>
          </section>

          <section>
            <h2>Área</h2>
            <p class="dica" id="dica-area">Escolha uma forma na barra sobre o mapa e desenhe a área.</p>
            <div id="info-area" class="info" hidden></div>
          </section>

          <div id="abas" role="tablist">
            <button type="button" role="tab" data-aba="modelo" aria-selected="true">Modelo</button>
            <button type="button" role="tab" data-aba="camadas" aria-selected="false">Camadas</button>
          </div>
          <div id="aba-modelo" role="tabpanel"></div>
          <div id="aba-camadas" role="tabpanel" hidden>
            <p class="dica">Prédios, ruas, água, cobertura do solo, árvores e curvas de nível chegam nas fases C e D.</p>
          </div>

          <footer id="creditos"></footer>
        </div>

        <div id="acoes">
          <div id="cores" class="info"></div>
          <div class="linha">
            <button id="btn-gerar" type="button" class="principal" disabled>Gerar modelo 3D</button>
            <button id="btn-stl" type="button" disabled>Baixar STL</button>
          </div>
          <div id="progresso" hidden><div id="progresso-barra"></div></div>
          <div id="status" class="info" hidden></div>
        </div>
      </aside>

      <main>
        <div id="mapa-area">
          <div id="mapa"></div>
          <div id="ferramentas" role="toolbar" aria-label="Ferramentas de seleção">
            <button type="button" data-ferramenta="retangulo" title="Retângulo: arraste no mapa">
              <svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" /></svg>Retângulo
            </button>
            <button type="button" data-ferramenta="circulo" title="Círculo: arraste do centro para fora">
              <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /></svg>Círculo
            </button>
            <button type="button" data-ferramenta="hexagono" title="Hexágono: arraste do centro para fora">
              <svg viewBox="0 0 20 20"><polygon points="17,10 13.5,16.1 6.5,16.1 3,10 6.5,3.9 13.5,3.9" /></svg>Hexágono
            </button>
            <button type="button" data-ferramenta="poligono" title="Polígono: clique ponto a ponto">
              <svg viewBox="0 0 20 20"><polygon points="3,15 6,4 13,7 17,3 16,16" /></svg>Polígono
            </button>
            <span class="separador"></span>
            <button type="button" id="btn-cancelar" hidden>Cancelar</button>
            <button type="button" id="btn-gerar-mapa" class="principal" disabled>Gerar modelo 3D</button>
          </div>
          <div id="dica-ferramenta" hidden></div>
        </div>
        <div id="previa">
          <div id="previa-vazia">A pré-visualização 3D aparece aqui depois de gerar o modelo.</div>
          <button type="button" id="btn-aramado" class="flutuante" hidden aria-pressed="false" title="Mostrar as arestas dos triângulos">Wireframe</button>
          <div id="caixa-info" hidden></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
